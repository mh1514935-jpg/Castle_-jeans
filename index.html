<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Castle Jeans</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; text-align: center; }
    .card { background-color: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #334155; }
    h1 { color: #fbbf24; margin-bottom: 5px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #475569; }
    input { background-color: #0f172a; color: #fff; }
    button { background-color: #10b981; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background-color: #059669; }
  </style>
</head>
<body>

  <h1>🏰 Castle Jeans</h1>
  <p>نظام إدارة المبيعات والمخزون</p>

  <div class="card">
    <h3>تسجيل عملية بيع</h3>
    <input type="text" placeholder="كود القطعة (الباركود)">
    <input type="number" value="1" placeholder="الكمية">
    <input type="tel" placeholder="رقم واتساب العميل">
    <button onclick="alert('تم تسجيل العملية بنجاح!')">إتمام البيع</button>
  </div>

</body>
</html>
